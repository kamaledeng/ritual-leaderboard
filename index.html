<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ritual Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>

<style>
body{background:#0B0E14;color:#fff;font-family:Inter;margin:0}
.container{max-width:900px;margin:auto;padding:20px}

.card{background:#0e1218;border:1px solid #2A3241;border-radius:16px;padding:25px;margin-top:20px}

.connect-btn{padding:10px 20px;border:1px solid #8B5CF6;background:transparent;color:#8B5CF6;border-radius:8px;cursor:pointer}
.connect-btn.connected{color:#fff;border-color:#2A3241}

.wallet-option{width:100%;padding:15px;border:1px solid #2A3241;background:#0B0E14;color:#fff;border-radius:10px;margin-bottom:10px;cursor:pointer}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center}
.modal.active{display:flex}

.insight{background:#080b0e;border:1px solid #2A3241;padding:15px;border-radius:10px;margin-top:15px;color:#8B94A5}

.progress{height:10px;background:#2A3241;border-radius:10px;margin-top:10px}
.progress-bar{height:10px;background:#00ff88;border-radius:10px;width:0%}
</style>
</head>

<body>

<div class="container">

<button id="connectBtn" class="connect-btn">Connect Wallet</button>

<div id="modal" class="modal">
<div class="card" style="width:300px">

<h3>Connect Wallet</h3>

<button class="wallet-option" onclick="connectMetaMask()">MetaMask / Browser 🦊</button>
<button class="wallet-option" onclick="alert('Soon')">WalletConnect 🔗</button>
<button class="wallet-option" onclick="alert('Soon')">Coinbase 🟦</button>

</div>
</div>

<div class="card">
<h2>Profile</h2>

<p id="address">-</p>

<h1 id="tx">0</h1>
<p>Total Transactions</p>

<h1 id="balance">0</h1>
<p>Balance</p>

<div class="insight" id="insight">
Connect wallet dulu
</div>

<div class="insight">
Progress to next rank
<div class="progress">
<div id="progressBar" class="progress-bar"></div>
</div>
<p id="progressText"></p>
</div>

</div>

</div>

<script>

let leaderboard = [
{wallet:"A",tx:24500},
{wallet:"B",tx:18320},
{wallet:"C",tx:15400},
{wallet:"D",tx:12105},
{wallet:"E",tx:9840},
{wallet:"F",tx:7650},
{wallet:"G",tx:6100}
]

const btn=document.getElementById("connectBtn")
const modal=document.getElementById("modal")

btn.onclick=()=>modal.classList.add("active")

async function connectMetaMask(){
if(typeof window.ethereum==="undefined"){
alert("install wallet dulu")
return
}

const accounts=await window.ethereum.request({method:"eth_requestAccounts"})
const addr=accounts[0]

btn.innerText=addr.slice(0,6)+"..."+addr.slice(-4)
btn.classList.add("connected")
modal.classList.remove("active")

load(addr)
}

async function load(addr){

document.getElementById("address").innerText=addr

const provider=new ethers.BrowserProvider(window.ethereum)

const tx=await provider.getTransactionCount(addr)
const bal=await provider.getBalance(addr)

const eth=parseFloat(ethers.formatEther(bal)).toFixed(3)

document.getElementById("tx").innerText=tx
document.getElementById("balance").innerText=eth+" RITUAL"

leaderboard.push({wallet:addr,tx:tx})
leaderboard.sort((a,b)=>b.tx-a.tx)

let rank=leaderboard.findIndex(x=>x.wallet===addr)+1

// insight
let insight=""
if(tx<100){
insight="Wallet kamu masih low activity, coba lebih sering interact"
}else if(tx<1000){
insight="Lumayan aktif, tapi masih jauh dari top rank"
}else{
insight="Gila aktif, kamu udah masuk high tier user"
}

document.getElementById("insight").innerText=insight

// progress
let next=leaderboard[rank-2]

if(next){
let need=next.tx-tx
let percent=(tx/next.tx)*100

document.getElementById("progressBar").style.width=Math.min(percent,100)+"%"
document.getElementById("progressText").innerText=
"butuh "+need+" tx lagi buat naik rank"
}else{
document.getElementById("progressText").innerText="kamu rank 1"
}

}

</script>

</body>
</html>
