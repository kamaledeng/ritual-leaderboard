<!DOCTYPE html>
<html>
<head>
  <title>Ritual Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Ritual Activity Leaderboard</h1>
<p class="sub">Live activity (last 20 blocks)</p>

<div class="box">
  <input id="walletInput" placeholder="Enter wallet address (0x...)" />
  <button onclick="addWallet()">Add</button>
</div>

<p id="count"></p>

<div id="empty"></div>

<h2>Your Wallets</h2>
<div id="stats"></div>

<h2>Leaderboard</h2>
<p id="loading">Loading...</p>
<ul id="leaderboard"></ul>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
<script src="script.js"></script>

</body>
</html>
