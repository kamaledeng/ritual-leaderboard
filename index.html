<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Testnet Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav-bar">
        <!-- Logo Sirkular Anda -->
        <div class="logo-circle">
            <span class="logo-text">!kamalz</span>
        </div>
        <!-- Tombol Connect Wallet -->
        <button id="connectWalletBtn" class="connect-btn">Connect Wallet</button>
    </div>

    <div class="container">
        <h1>Top Testers Leaderboard</h1>
        <p class="subtitle">Ranked by Total Transactions on Ritual Testnet</p>

        <div class="table-container">
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Wallet Address</th>
                        <th>Total TXs</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Data will be injected here by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
