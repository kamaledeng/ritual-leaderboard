<!DOCTYPE html>
<html>
<head>
  <title>Ritual Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      margin-top: 30px;
    }

    .box {
      margin: 20px;
    }

    input {
      padding: 10px;
      width: 260px;
    }

    button {
      padding: 10px;
      margin-left: 10px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .card {
      background: #1e293b;
      padding: 10px;
      margin: 10px auto;
      border-radius: 8px;
      width: 300px;
    }

    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #1e293b;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    .you {
      color: #22c55e;
      font-weight: bold;
    }

    .sub {
      color: #94a3b8;
    }
  </style>
</head>

<body>

<h1>Ritual Activity Leaderboard</h1>
<p class="sub">Live (last 20 blocks)</p>

<div class="box">
  <input id="walletInput" placeholder="Enter wallet (0x...)" />
  <button onclick="addWallet()">Add</button>
</div>

<p id="count"></p>
<p id="empty"></p>

<h2>Your Wallets</h2>
<div id="stats"></div>

<h2>Leaderboard</h2>
<p id="loading">Loading...</p>

<table>
  <thead>
    <tr>
      <th>Rank</th>
      <th>Wallet</th>
      <th>Score</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="leaderboard"></tbody>
</table>

<script>
const RPC = "https://rpc.ritualfoundation.org";
const provider = new ethers.providers.JsonRpcProvider(RPC);

let wallets = JSON.parse(localStorage.getItem("wallets") || "[]");
let leaderboard = [];

function addWallet() {
  const input = document.getElementById("walletInput").value.trim().toLowerCase();

  if (!input.startsWith("0x")) {
    alert("invalid wallet");
    return;
  }

  if (!wallets.includes(input)) {
    wallets.push(input);
    localStorage.setItem("wallets", JSON.stringify(wallets));
  }

  document.getElementById("walletInput").value = "";
  renderWallets();
}

function renderWallets() {
  const stats = document.getElementById("stats");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");

  stats.innerHTML = "";
  count.innerText = `Tracking ${wallets.length} wallet(s)`;

  if (wallets.length === 0) {
    empty.innerText = "Add wallet to track rank";
    return;
  } else {
    empty.innerText = "";
  }

  wallets.forEach(w => {
    let found = leaderboard.find(x => x.wallet === w);
    let rank = leaderboard.findIndex(x => x.wallet === w);

    if (rank === -1) rank = leaderboard.length;

    stats.innerHTML += `
      <div class="card">
        ${short(w)} <br>
        Rank: #${rank + 1} <br>
        Score: ${found ? found.tx : 0} <br>
        ${found ? "🔥 Active" : "💤 Idle"}
      </div>
    `;
  });
}

async function load() {
  document.getElementById("loading").innerText = "Updating...";

  try {
    const latest = await provider.getBlockNumber();
    let map = {};

    for (let i = 0; i < 20; i++) {
      const block = await provider.getBlockWithTransactions(latest - i);

      block.transactions.forEach(tx => {
        const addr = tx.from.toLowerCase();
        map[addr] = (map[addr] || 0) + 1;
      });
    }

    leaderboard = Object.entries(map).map(([wallet, tx]) => ({
      wallet,
      tx
    }));

    leaderboard.sort((a, b) => b.tx - a.tx);

    renderLeaderboard();
    renderWallets();

  } catch (e) {
    document.getElementById("loading").innerText = "RPC error";
  }
}

function renderLeaderboard() {
  const table = document.getElementById("leaderboard");
  table.innerHTML = "";

  leaderboard.slice(0, 50).forEach((item, i) => {
    const isYou = wallets.includes(item.wallet);

    table.innerHTML += `
      <tr class="${isYou ? "you" : ""}">
        <td>#${i + 1}</td>
        <td>
          <a href="https://explorer.ritualfoundation.org/address/${item.wallet}" target="_blank">
            ${short(item.wallet)}
          </a>
          ${isYou ? "(You)" : ""}
        </td>
        <td>${item.tx}</td>
        <td>${item.tx > 0 ? "🔥" : "💤"}</td>
      </tr>
    `;
  });

  document.getElementById("loading").innerText = "";
}

function short(a) {
  return a.slice(0,6) + "..." + a.slice(-4);
}

load();
setInterval(load, 10000);
</script>

</body>
</html>
