<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testnet Leaderboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Tempat untuk logo sirkular Anda -->
        <div class="logo-circle">
            <span class="logo-text">!kamalz</span>
        </div>
        
        <h1>Top Testers Peringkat</h1>
        <p class="subtitle">Berdasarkan Jumlah Transaksi di Testnet</p>

        <div class="table-container">
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Wallet Address</th>
                        <th>Total Transaksi</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Data dari JavaScript akan muncul di sini -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
