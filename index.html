<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Dashboard & Leaderboard</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-main: #0B0E14;
            --bg-card: #0e1218;
            --border-color: #2A3241;
            --text-main: #FFFFFF;
            --text-muted: #8B94A5;
            --accent-ritual: #8B5CF6; 
            --accent-green: #00ff88;
            --modal-overlay: rgba(11, 14, 20, 0.85);
        }

        html { scroll-behavior: smooth; }

        body {
            margin: 0; padding: 0; background-color: var(--bg-main); color: var(--text-main);
            font-family: 'Inter', sans-serif; display: flex; flex-direction: column; 
            align-items: center; min-height: 100vh; padding-bottom: 50px;
        }

        /* Navbar */
        .navbar {
            width: 100%; padding: 15px 0; border-bottom: 1px solid var(--border-color);
            background-color: var(--bg-card); display: flex; justify-content: center;
            margin-bottom: 40px; position: sticky; top: 0; z-index: 100;
        }

        .nav-container { width: 90%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; }
        .nav-links { display: flex; gap: 30px; align-items: center; }
        .nav-item {
            display: flex; align-items: center; gap: 8px; color: var(--text-muted);
            text-decoration: none; font-size: 16px; font-weight: 500; transition: color 0.2s; cursor: pointer;
        }
        .nav-item:hover, .nav-item.active { color: var(--text-main); }
        .nav-item svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .connect-btn {
            background-color: rgba(139, 92, 246, 0.1); color: var(--accent-ritual);
            border: 1px solid var(--accent-ritual); padding: 10px 20px; border-radius: 8px; 
            font-weight: 600; font-family: 'Inter', sans-serif; cursor: pointer; transition: all 0.2s;
        }
        .connect-btn:hover { background-color: var(--accent-ritual); color: #fff; }
        .connect-btn.connected {
            background-color: var(--bg-main); border-color: var(--border-color);
            color: var(--text-main); font-family: 'JetBrains Mono', monospace;
        }

        .container { width: 90%; max-width: 900px; }

        .card {
            background-color: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 30px; margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); scroll-margin-top: 100px;
        }
        .card-header { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-size: 20px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 10px;}
        
        .streaming-badge {
            display: flex; align-items: center; gap: 8px; color: var(--accent-green);
            font-size: 12px; font-weight: 600; background-color: rgba(0, 255, 136, 0.05);
            padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(0, 255, 136, 0.2);
        }
        .pulse-circle {
            width: 8px; height: 8px; background-color: var(--accent-green);
            border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 1; } 50% { transform: scale(1.2); opacity: 0.7; } 100% { transform: scale(0.95); opacity: 1; } }

        .profile-content { display: none; }
        .profile-content.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .wallet-display {
            background-color: var(--bg-main); border: 1px solid var(--border-color);
            padding: 12px 20px; border-radius: 8px; font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted); margin-bottom: 25px; display: inline-block; font-size: 14px;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .stat-card-custom {
            background-color: #0b0f13; border: 1px solid var(--border-color); border-radius: 16px; 
            padding: 25px; display: flex; flex-direction: column; transition: transform 0.2s;
        }
        .stat-card-custom:hover { transform: translateY(-3px); }
        
        .icon-box {
            width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; 
            align-items: center; font-size: 20px; margin-bottom: 25px;
        }
        .icon-green { background-color: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.3); color: var(--accent-green); }
        .icon-purple { background-color: rgba(139, 92, 246, 0.05); border: 1px solid rgba(139, 92, 246, 0.3); color: var(--accent-ritual); }
        
        .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 36px; font-weight: 700; color: var(--text-main); margin: 0 0 10px 0; letter-spacing: -1px; }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin: 0; font-weight: 600;}
        .stat-sub { font-size: 11px; color: #555; margin: 5px 0 0 0; font-style: italic; }
        .currency { font-family: 'Inter', sans-serif; font-size: 16px; color: var(--accent-ritual); font-weight: 600; margin-left: 5px; }
        .emoji-icon { font-size: 16px; margin-bottom: 10px; display: block; }

        .disconnected-overlay { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 0; text-align: center; }
        .disconnected-overlay.hidden { display: none; }
        .lock-icon { font-size: 40px; margin-bottom: 15px; opacity: 0.5; }

        /* FITUR PENCARIAN RANK */
        .search-rank-box {
            display: flex; align-items: center; background-color: var(--bg-main);
            border: 1px solid var(--border-color); border-radius: 10px;
            padding: 12px 15px; margin-bottom: 20px; transition: border-color 0.2s;
        }
        .search-rank-box:focus-within { border-color: var(--accent-ritual); }
        .search-rank-box svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; margin-right: 15px; }
        #rankSearchInput {
            flex: 1; background: transparent; border: none; color: var(--text-main);
            font-family: 'JetBrains Mono', monospace; font-size: 14px; outline: none;
        }

        /* Leaderboard Table */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { color: var(--text-muted); font-size: 12px; font-weight: 500; text-transform: uppercase; padding: 15px 20px; border-bottom: 1px solid var(--border-color); }
        td { padding: 18px 20px; border-bottom: 1px solid rgba(42, 50, 65, 0.5); font-size: 14px; }
        tbody tr:hover { background-color: rgba(255, 255, 255, 0.02); }
        .rank-badge {
            display: inline-block; width: 28px; height: 28px; line-height: 28px; text-align: center;
            border-radius: 6px; background-color: var(--bg-main); color: var(--text-muted); font-weight: 600; font-size: 13px;
        }
        tr:nth-child(1) .rank-badge { background-color: rgba(251, 191, 36, 0.1); color: #FBBF24; }
        tr:nth-child(2) .rank-badge { background-color: rgba(156, 163, 175, 0.1); color: #9CA3AF; }
        tr:nth-child(3) .rank-badge { background-color: rgba(180, 83, 9, 0.1); color: #B45309; }
        .wallet-address { font-family: 'JetBrains Mono', monospace; color: var(--text-main); }
        .tx-count { font-weight: 600; color: var(--accent-green); font-size: 15px; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: var(--modal-overlay); 
            backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-content {
            background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; 
            width: 90%; max-width: 360px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            transform: translateY(20px); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; font-size: 18px; font-weight: 600; }
        .close-modal { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .close-modal:hover { color: var(--text-main); }
        .wallet-option {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            background-color: var(--bg-main); border: 1px solid var(--border-color); padding: 15px 20px; 
            border-radius: 12px; margin-bottom: 10px; color: var(--text-main); font-size: 16px; 
            font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .wallet-option:hover { border-color: var(--accent-ritual); background-color: rgba(139, 92, 246, 0.05); }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="nav-container">
            <div class="nav-links">
                <a href="#profile-section" class="nav-item active" id="navProfile">
                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Profile
                </a>
                <a href="#leaderboard-section" class="nav-item" id="navLeaderboard">
                    <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                    Leaderboard
                </a>
            </div>
            <button id="navConnectBtn" class="connect-btn">Connect Wallet</button>
        </div>
    </div>

    <!-- Modal Wallet -->
    <div id="walletModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Connect Wallet</h3>
                <button id="closeModal" class="close-modal">&times;</button>
            </div>
            <div class="wallet-list">
                <button class="wallet-option" onclick="connectEVMWallet('MetaMask')"><span>MetaMask</span> <span>🦊</span></button>
                <button class="wallet-option" onclick="connectEVMWallet('Rabby')"><span>Rabby Wallet</span> <span>🐰</span></button>
            </div>
        </div>
    </div>

    <div class="container">

        <!-- 1. MY PROFILE SECTION -->
        <div class="card" id="profile-section">
            <div class="card-header">
                <h2 class="card-title">My Profile</h2>
                <div class="streaming-badge" id="liveBadge" style="display: none;">
                    <span class="pulse-circle"></span> Streaming live
                </div>
            </div>

            <div id="disconnectedState" class="disconnected-overlay">
                <div class="lock-icon">🔒</div>
                <p style="color: var(--text-muted); margin-bottom: 20px;">Please connect your wallet to view your on-chain data.</p>
                <button class="connect-btn" onclick="document.getElementById('walletModal').classList.add('active')">Connect to View</button>
            </div>

            <div id="connectedState" class="profile-content">
                <div class="wallet-display" id="profileAddress">WALLET: 0x...</div>
                
                <div class="stats-grid">
                    <div class="stat-card-custom">
                        <div class="icon-box icon-green">#</div>
                        <h2 class="stat-value" id="profileTxs">0</h2>
                        <p class="stat-label">TOTAL TRANSACTIONS</p>
                    </div>

                    <div class="stat-card-custom">
                        <div class="icon-box icon-purple">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M16 12h2"></path></svg>
                        </div>
                        <h2 class="stat-value" id="profileBalance">0 <span class="currency">RITUAL</span></h2>
                        <span class="emoji-icon">🔮</span>
                        <p class="stat-label">WALLET BALANCE</p>
                        <p class="stat-sub">Testnet Native Token</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. GLOBAL LEADERBOARD SECTION DENGAN FITUR SEARCH RANK -->
        <div class="card" id="leaderboard-section">
            <div class="card-header">
                <h2 class="card-title">🏆 Global Leaderboard</h2>
            </div>
            
            <!-- FITUR CEK RANK DOMPET -->
            <div class="search-rank-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="rankSearchInput" placeholder="Cek rank wallet... (Paste address 0x...)">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Wallet Address</th>
                            <th>Total Transactions</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <!-- Data Leaderboard -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // --- Navigasi ---
        const navProfile = document.getElementById('navProfile');
        const navLeaderboard = document.getElementById('navLeaderboard');
        navProfile.addEventListener('click', () => { navProfile.classList.add('active'); navLeaderboard.classList.remove('active'); });
        navLeaderboard.addEventListener('click', () => { navLeaderboard.classList.add('active'); navProfile.classList.remove('active'); });

        // --- Wallet & Real Data Fetching (Ethers.js) ---
        const navConnectBtn = document.getElementById('navConnectBtn');
        const walletModal = document.getElementById('walletModal');
        const closeModal = document.getElementById('closeModal');
        const liveBadge = document.getElementById('liveBadge');
        
        navConnectBtn.addEventListener('click', () => {
            if (!navConnectBtn.classList.contains('connected')) walletModal.classList.add('active');
        });
        closeModal.addEventListener('click', () => walletModal.classList.remove('active'));

        async function connectEVMWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    
                    const shortAddress = `${account.substring(0,6)}...${account.substring(account.length-4)}`;
                    navConnectBtn.textContent = shortAddress;
                    navConnectBtn.classList.add('connected');
                    walletModal.classList.remove('active');
                    
                    loadRealUserProfile(account);
                } catch (error) { console.error("Koneksi dibatalkan:", error); }
            } else { alert(`Tolong install ekstensi MetaMask atau Web3 wallet lainnya!`); }
        }

        async function loadRealUserProfile(address) {
            document.getElementById('disconnectedState').classList.add('hidden');
            document.getElementById('connectedState').classList.add('active');
            liveBadge.style.display = "flex"; 
            
            document.getElementById('profileAddress').textContent = `WALLET: ${address}`;
            
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                document.getElementById('profileTxs').textContent = "...";
                document.getElementById('profileBalance').innerHTML = `... <span class="currency">RITUAL</span>`;

                const txCount = await provider.getTransactionCount(address);
                const balanceWei = await provider.getBalance(address);
                const balanceEth = ethers.formatEther(balanceWei);
                const formattedBalance = parseFloat(balanceEth).toFixed(3);

                document.getElementById('profileTxs').textContent = txCount;
                document.getElementById('profileBalance').innerHTML = `${formattedBalance} <span class="currency">RITUAL</span>`;
            } catch (err) {
                console.error("Gagal menarik data dari blockchain:", err);
                document.getElementById('profileTxs').textContent = "Error";
                document.getElementById('profileBalance').innerHTML = `Error`;
            }
        }

        // --- Leaderboard Dummy & Fitur Pencarian ---
        const globalLeaderboardData = [
            { wallet: "0x1a2b890c93c4df1e2a", txs: 24500 },
            { wallet: "0x9f8e432a27d6ca9b5f", txs: 18320 },
            { wallet: "0x5b6a778b11f2eb3d4c", txs: 15400 },
            { wallet: "0x4c3d112e88b9ac4e5d", txs: 12105 },
            { wallet: "0x7e6f554c22a1bd7f8e", txs: 9840 },
            { wallet: "0xcf3da8d27bc354c8be", txs: 456 } // Contoh wallet dari gambar Anda
        ];

        function renderLeaderboard() {
            const tableBody = document.getElementById('leaderboardBody');
            tableBody.innerHTML = ''; 

            globalLeaderboardData.forEach((user, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="rank-badge">${index + 1}</span></td>
                    <td><span class="wallet-address">${user.wallet}</span></td>
                    <td><span class="tx-count">${user.txs.toLocaleString()} TXs</span></td>
                `;
                tableBody.appendChild(row);
            });
        }
        renderLeaderboard();

        // --- LOGIKA FILTER/SEARCH RANK WALLET ---
        document.getElementById('rankSearchInput').addEventListener('input', function(e) {
            const filterText = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#leaderboardBody tr');
            
            rows.forEach(row => {
                const walletText = row.querySelector('.wallet-address').textContent.toLowerCase();
                // Jika wallet cocok dengan ketikan, tampilkan. Jika tidak, sembunyikan.
                if(walletText.includes(filterText)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
