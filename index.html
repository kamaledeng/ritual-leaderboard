<!DOCTYPE html>
<html>
<head>
  <title>Ritual Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

  <style>
    body {
      background: #0b1220;
      color: #e5e7eb;
      font-family: Arial;
      margin: 0;
    }

    .container {
      width: 90%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      font-size: 28px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .rank-box {
      background: #1f2937;
      padding: 20px;
      border-radius: 10px;
      font-size: 28px;
      text-align: center;
      margin-top: 10px;
    }

    input {
      padding: 10px;
      width: 70%;
      border-radius: 6px;
      border: none;
    }

    button {
      padding: 10px;
      margin-left: 10px;
      background: #22c55e;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #1f2937;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    .you {
      color: #22c55e;
      font-weight: bold;
    }

    .sub {
      color: #9ca3af;
    }
  </style>
</head>

<body>

<div class="container">

<h1>⚡ Ritual Leaderboard</h1>
<p class="sub">Based on last 20 blocks</p>

<div class="card">
  <input id="walletInput" placeholder="Enter wallet (0x...)" />
  <button onclick="addWallet()">Add</button>
</div>

<div class="card">
  <h3>Your Rank</h3>
  <div id="yourRank">-</div>
  <div class="rank-box" id="rankBox">#-</div>
</div>

<div class="card">
  <h3>Leaderboard</h3>
  <p id="loading">Loading...</p>

  <table>
    <thead>
      <tr>
        <th>Rank</th>
        <th>Wallet</th>
        <th>Score</th>
      </tr>
    </thead>
    <tbody id="leaderboard"></tbody>
  </table>
</div>

</div>

<script>
const RPC = "https://rpc.ritualfoundation.org";
const provider = new ethers.providers.JsonRpcProvider(RPC);

let wallets = JSON.parse(localStorage.getItem("wallets") || "[]");
let leaderboard = [];

function addWallet() {
  const input = document.getElementById("walletInput").value.toLowerCase();

  if (!input.startsWith("0x")) return alert("invalid wallet");

  if (!wallets.includes(input)) {
    wallets = [input]; // fokus 1 wallet utama
    localStorage.setItem("wallets", JSON.stringify(wallets));
  }

  document.getElementById("walletInput").value = "";
}

async function load() {
  document.getElementById("loading").innerText = "Updating...";

  try {
    const latest = await provider.getBlockNumber();
    let map = {};

    for (let i = 0; i < 20; i++) {
      const block = await provider.getBlockWithTransactions(latest - i);

      block.transactions.forEach(tx => {
        const addr = tx.from.toLowerCase();
        map[addr] = (map[addr] || 0) + 1;
      });
    }

    leaderboard = Object.entries(map).map(([wallet, tx]) => ({
      wallet,
      tx
    }));

    leaderboard.sort((a, b) => b.tx - a.tx);

    render();

  } catch {
    document.getElementById("loading").innerText = "RPC error";
  }
}

function render() {
  const table = document.getElementById("leaderboard");
  table.innerHTML = "";

  let myWallet = wallets[0];
  let myRank = leaderboard.findIndex(x => x.wallet === myWallet);

  if (myRank === -1) myRank = leaderboard.length;

  document.getElementById("yourRank").innerText =
    myWallet ? short(myWallet) : "No wallet";

  document.getElementById("rankBox").innerText =
    "#" + (myRank + 1);

  leaderboard.slice(0, 50).forEach((item, i) => {
    const isYou = item.wallet === myWallet;

    table.innerHTML += `
      <tr class="${isYou ? "you" : ""}">
        <td>#${i + 1}</td>
        <td>
          <a href="https://explorer.ritualfoundation.org/address/${item.wallet}" target="_blank">
            ${short(item.wallet)}
          </a>
          ${isYou ? "(You)" : ""}
        </td>
        <td>${item.tx}</td>
      </tr>
    `;
  });

  document.getElementById("loading").innerText = "";
}

function short(a) {
  return a.slice(0,6) + "..." + a.slice(-4);
}

load();
setInterval(load, 10000);
</script>

</body>
</html>
