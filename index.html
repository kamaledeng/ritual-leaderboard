<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ritual Testnet Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ethers -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div>
    <h1>Ritual Testnet Leaderboard</h1>
    <p>Real wallet + semi-real analytics</p>
  </div>

  <div class="header-right">
    <span class="badge">● Testnet Live</span>
    <button onclick="connectWallet()">Connect Wallet</button>
  </div>
</header>

<div class="container">

  <!-- STATS -->
  <div class="stats">
    <div class="card">
      <h2 id="participants">—</h2>
      <p>Wallets</p>
    </div>

    <div class="card">
      <h2 id="totalTx">—</h2>
      <p>Total Tx</p>
    </div>

    <div class="card">
      <h2 id="claims">—</h2>
      <p>Faucet Claims</p>
    </div>

    <div class="card">
      <h2 id="faucet">—</h2>
      <p>Faucet Left</p>
    </div>
  </div>

  <!-- YOUR RANK -->
  <div class="card big">
    <h3>Your Wallet</h3>

    <p id="walletAddress">Not connected</p>

    <input id="walletInput" placeholder="0x..." />
    <button onclick="checkRank()">Check Rank</button>

    <div id="result"></div>
  </div>

  <!-- TABLE -->
  <div class="card">
    <h3>Leaderboard</h3>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Wallet</th>
          <th>Score</th>
          <th>Tx</th>
          <th>Claims</th>
        </tr>
      </thead>

      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
